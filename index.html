<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Превьюер PWA</title>
    <!-- PWA метаданные -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
            display: flex;
            flex-direction: column;
        }
        .container {
            max-width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            flex-grow: 1;
        }
        h1 {
            text-align: center;
            color: #5d3fd3;
            margin-bottom: 25px;
            font-size: 1.8em;
            font-weight: 700;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 20px;
            border: 2px solid #e1e5e9;
            border-radius: 15px;
            font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace;
            font-size: 15px;
            line-height: 1.5;
            background: #f8f9fa;
            resize: none;
            transition: all 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }
        button {
            padding: 18px 15px;
            border: none;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        button:active {
            transform: scale(0.97);
        }
        .preview-btn {
            grid-column: span 2;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .clear-btn {
            background: #f8f9fa;
            color: #dc3545;
            border: 2px solid #f1f3f4;
        }
        .paste-btn {
            background: #f8f9fa;
            color: #28a745;
            border: 2px solid #f1f3f4;
        }
        .preview-frame {
            width: 100%;
            height: 300px;
            border: 2px solid #e1e5e9;
            border-radius: 15px;
            background: white;
            margin-top: 20px;
            display: none;
        }
        .status-bar {
            margin-top: 15px;
            padding: 10px;
            background: #e8f4fd;
            border-radius: 10px;
            font-size: 0.9em;
            color: #0d6efd;
            text-align: center;
        }
        .instructions {
            background: #fff8e1;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-size: 0.9em;
            border-left: 4px solid #ffb300;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛠️ HTML Превьюер PWA</h1>
        <textarea id="html-code" placeholder="<!DOCTYPE html>
<html>
<head>
    <title>Моя страница</title>
</head>
<body>
    <h1>Привет!</h1>
    <p>Это превью.</p>
</body>
</html>"></textarea>
        
        <div class="buttons">
            <button class="preview-btn" id="previewBtn">
                👁️ Показать превью (полный экран)
            </button>
            <button class="clear-btn" id="clearBtn">
                🧹 Очистить
            </button>
            <button class="paste-btn" id="pasteBtn">
                📋 Вставить код
            </button>
        </div>
        
        <iframe class="preview-frame" id="previewFrame" sandbox="allow-scripts"></iframe>
        
        <div class="status-bar" id="statusBar">
            Готово к работе
        </div>
        
        <div class="instructions">
            <strong>📌 Инструкция:</strong> Нажмите «Показать превью» — откроется полноэкранный режим. Чтобы выйти, проведите пальцем от верхнего края вниз (или нажмите кнопку «Назад» на жестовой панели).
        </div>
    </div>

    <script>
        const htmlCode = document.getElementById('html-code');
        const previewBtn = document.getElementById('previewBtn');
        const clearBtn = document.getElementById('clearBtn');
        const pasteBtn = document.getElementById('pasteBtn');
        const previewFrame = document.getElementById('previewFrame');
        const statusBar = document.getElementById('statusBar');

        // Стартовый пример кода
        htmlCode.value = `<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пример страницы</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: #f0f0f0;
        }
        h1 {
            color: #3366cc;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin: 20px auto;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Ваш HTML работает!</h1>
        <p>Измените код слева и нажмите "Показать превью" снова.</p>
        <p>Время: <span id="time">${new Date().toLocaleTimeString()}</span></p>
        <button onclick="document.getElementById('time').innerHTML = new Date().toLocaleTimeString()">
            Обновить время
        </button>
    </div>
</body>
</html>`;

        // 1. КНОПКА "ПРЕВЬЮ" (исправленный полноэкранный режим)
        previewBtn.addEventListener('click', () => {
            if (!htmlCode.value.trim()) {
                statusBar.textContent = "Введите код!";
                statusBar.style.background = "#ffebee";
                statusBar.style.color = "#c62828";
                return;
            }
            
            // Открываем превью во фрейме
            previewFrame.srcdoc = htmlCode.value;
            previewFrame.style.display = "block";
            statusBar.textContent = "Превью открыт (полноэкранный режим)";
            statusBar.style.background = "#e8f5e9";
            statusBar.style.color = "#2e7d32";
            
            // Включаем полноэкранный режим для iframe
            setTimeout(() => {
                if (previewFrame.requestFullscreen) {
                    previewFrame.requestFullscreen();
                } else if (previewFrame.webkitRequestFullscreen) {
                    previewFrame.webkitRequestFullscreen();
                } else {
                    statusBar.textContent = "Полный экран не поддерживается";
                }
            }, 100);
        });

        // 2. КНОПКА "ОЧИСТИТЬ"
        clearBtn.addEventListener('click', () => {
            htmlCode.value = "";
            previewFrame.style.display = "none";
            statusBar.textContent = "Поле очищено";
            statusBar.style.background = "#fff3e0";
            statusBar.style.color = "#ef6c00";
        });

        // 3. КНОПКА "ВСТАВИТЬ"
        pasteBtn.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                htmlCode.value += text;
                statusBar.textContent = "Код вставлен из буфера";
                statusBar.style.background = "#e3f2fd";
                statusBar.style.color = "#1567c0";
            } catch (e) {
                statusBar.textContent = "Ошибка: Вставьте вручную (долгое нажатие → Вставить)";
                statusBar.style.background = "#ffebee";
                statusBar.style.color = "#c62828";
            }
        });

        // Следим за выходом из полноэкранного режима
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                previewFrame.style.display = "none";
                statusBar.textContent = "Превью закрыт";
                statusBar.style.background = "#f5f5f5";
                statusBar.style.color = "#757575";
            }
        });

        // Регистрация Service Worker для PWA (работает только на реальном хостинге)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .catch(err => console.log('SW регистрация не удалась:', err));
            });
        }
    </script>
</body>
</html>
