<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Previewer PWA</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
            display: flex;
            flex-direction: column;
        }
        
        .container {
            max-width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            flex-grow: 1;
        }
        
        h1 {
            text-align: center;
            color: #5d3fd3;
            margin-bottom: 25px;
            font-size: 1.8em;
            font-weight: 700;
        }
        
        textarea {
            width: 100%;
            height: 200px;
            padding: 20px;
            border: 2px solid #e1e5e9;
            border-radius: 15px;
            font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace;
            font-size: 15px;
            line-height: 1.5;
            background: #f8f9fa;
            resize: none;
            transition: all 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }
        
        button {
            padding: 18px 15px;
            border: none;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        button:active {
            transform: scale(0.97);
        }
        
        .preview-btn {
            grid-column: span 2;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .clean-btn {
            background: #f8f9fa;
            color: #dc3545;
            border: 2px solid #f1f3f4;
        }
        
        .paste-btn {
            background: #f8f9fa;
            color: #28a745;
            border: 2px solid #f1f3f4;
        }
        
        .pwa-btn {
            grid-column: span 2;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%);
            color: white;
            margin-top: 10px;
        }
        
        .preview-frame {
            width: 100%;
            height: 300px;
            border: 2px solid #e1e5e9;
            border-radius: 15px;
            background: white;
            margin-top: 20px;
            display: none;
        }
        
        .status-bar {
            margin-top: 15px;
            padding: 10px;
            background: #e8f4fd;
            border-radius: 10px;
            font-size: 0.9em;
            color: #0d6efd;
            text-align: center;
        }
        
        .instructions {
            background: #fff8e1;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-size: 0.9em;
            border-left: 4px solid #ffb300;
        }
        
        .fullscreen-close-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.5em;
            cursor: pointer;
            z-index: 10000;
            display: none;
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal {
            background: white;
            border-radius: 15px;
            padding: 25px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .modal h3 {
            margin-bottom: 15px;
            color: #5d3fd3;
        }
        
        .modal-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 15px;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        
        .modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
        }
        
        .modal-btn.primary {
            background: #667eea;
            color: white;
        }
        
        .modal-btn.secondary {
            background: #f8f9fa;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛠️ HTML Previewer PWA</h1>
        <textarea id="html-code" placeholder="<!DOCTYPE html>
<html>
<head>
    <title>My Page</title>
</head>
<body>
    <h1>Hello World!</h1>
    <p>This is a test page.</p>
</body>
</html>"></textarea>
        
        <div class="buttons">
            <button class="preview-btn" id="previewBtn">
                👁️ Open HTML Preview
            </button>
            <button class="clean-btn" id="cleanBtn">
                🗑️ Clean
            </button>
            <button class="paste-btn" id="pasteBtn">
                📋 Paste Code
            </button>
            <button class="pwa-btn" id="pwaBtn">
                ✨ Make HTML PWA
            </button>
        </div>
        
        <iframe class="preview-frame" id="previewFrame" sandbox="allow-scripts"></iframe>
        
        <div class="status-bar" id="statusBar">
            Ready to work
        </div>
        
        <div class="instructions">
            <strong>📌 How to use:</strong> Click "Open HTML Preview" - opens in new window. To exit - use back button or close tab.
        </div>
    </div>
    
    <!-- Modal for PWA creation -->
    <div class="modal-overlay" id="pwaModal">
        <div class="modal">
            <h3>✨ Create PWA Application</h3>
            <input type="text" class="modal-input" id="pwaAppName" placeholder="My App" value="My HTML App">
            <input type="text" class="modal-input" id="pwaShortName" placeholder="App (max 12 chars)" value="HTML App">
            <input type="color" class="modal-input" id="pwaThemeColor" value="#667eea" style="height: 50px;">
            
            <div class="modal-buttons">
                <button class="modal-btn secondary" id="cancelPwaBtn">Cancel</button>
                <button class="modal-btn primary" id="generatePwaBtn">Generate PWA</button>
            </div>
        </div>
    </div>

    <script>
        // =================== ELEMENTS ===================
        const htmlCode = document.getElementById('html-code');
        const previewBtn = document.getElementById('previewBtn');
        const cleanBtn = document.getElementById('cleanBtn');
        const pasteBtn = document.getElementById('pasteBtn');
        const pwaBtn = document.getElementById('pwaBtn');
        const previewFrame = document.getElementById('previewFrame');
        const statusBar = document.getElementById('statusBar');
        
        // PWA Modal elements
        const pwaModal = document.getElementById('pwaModal');
        const pwaAppName = document.getElementById('pwaAppName');
        const pwaShortName = document.getElementById('pwaShortName');
        const pwaThemeColor = document.getElementById('pwaThemeColor');
        const generatePwaBtn = document.getElementById('generatePwaBtn');
        const cancelPwaBtn = document.getElementById('cancelPwaBtn');
        
        // =================== INITIAL CODE ===================
        htmlCode.value = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: #f0f0f0;
        }
        h1 {
            color: #3366cc;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin: 20px auto;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Your HTML works!</h1>
        <p>Change code and click "Open HTML Preview" again.</p>
        <p>Time: <span id="time">${new Date().toLocaleTimeString()}</span></p>
        <button onclick="document.getElementById('time').innerHTML = new Date().toLocaleTimeString()">
            Update Time
        </button>
    </div>
</body>
</html>`;

        // =================== PREVIEW BUTTON ===================
        previewBtn.addEventListener('click', () => {
            if (!htmlCode.value.trim()) {
                statusBar.textContent = "Enter HTML code!";
                statusBar.style.background = "#ffebee";
                statusBar.style.color = "#c62828";
                return;
            }
            
            try {
                // Open in new window
                const newWindow = window.open('', '_blank');
                if (newWindow) {
                    newWindow.document.write(htmlCode.value);
                    newWindow.document.close();
                    statusBar.textContent = "Preview opened in new window";
                    statusBar.style.background = "#e8f5e9";
                    statusBar.style.color = "#2e7d32";
                } else {
                    throw new Error('Popup blocker');
                }
            } catch (e) {
                statusBar.textContent = "Allow popups in browser settings";
                statusBar.style.background = "#ffebee";
                statusBar.style.color = "#c62828";
            }
        });

        // =================== CLEAN BUTTON ===================
        cleanBtn.addEventListener('click', () => {
            htmlCode.value = "";
            previewFrame.style.display = "none";
            statusBar.textContent = "Editor cleaned";
            statusBar.style.background = "#fff3e0";
            statusBar.style.color = "#ef6c00";
        });

        // =================== PASTE BUTTON ===================
        pasteBtn.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                htmlCode.value += text;
                statusBar.textContent = "Code pasted from clipboard";
                statusBar.style.background = "#e3f2fd";
                statusBar.style.color = "#1567c0";
            } catch (e) {
                statusBar.textContent = "Error: Paste manually (long press → Paste)";
                statusBar.style.background = "#ffebee";
                statusBar.style.color = "#c62828";
            }
        });

        // =================== PWA BUTTON ===================
        pwaBtn.addEventListener('click', () => {
            if (!htmlCode.value.trim()) {
                alert('Enter HTML code to create PWA!');
                return;
            }
            
            pwaModal.style.display = 'flex';
            pwaAppName.focus();
        });

        // Generate PWA package
        generatePwaBtn.addEventListener('click', () => {
            const appName = pwaAppName.value.trim() || 'My HTML App';
            const shortName = pwaShortName.value.trim() || 'HTML App';
            const themeColor = pwaThemeColor.value;
            
            // Create PWA package
            const pwaPackage = createPWAPackage(
                htmlCode.value,
                appName,
                shortName,
                themeColor
            );
            
            // Download as ZIP
            downloadAsZip(pwaPackage, appName);
            
            pwaModal.style.display = 'none';
            statusBar.textContent = `PWA "${appName}" generated!`;
            statusBar.style.background = "#e8f5e9";
            statusBar.style.color = "#2e7d32";
        });

        cancelPwaBtn.addEventListener('click', () => {
            pwaModal.style.display = 'none';
        });

        // Close modal on outside click
        pwaModal.addEventListener('click', (e) => {
            if (e.target === pwaModal) {
                pwaModal.style.display = 'none';
            }
        });

        // =================== PWA FUNCTIONS ===================
        function createPWAPackage(htmlCode, appName, shortName, themeColor) {
            const files = {
                'index.html': createIndexHTML(htmlCode, appName, themeColor),
                'manifest.json': createManifest(appName, shortName, themeColor),
                'sw.js': createServiceWorker(),
                'icon-192.png': 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMAAAADA...', // Placeholder
                'README.txt': createReadme(appName)
            };
            
            return files;
        }
        
        function createIndexHTML(code, appName, themeColor) {
            return `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${appName}</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <meta name="theme-color" content="${themeColor}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }
        .app-info {
            background: ${themeColor};
            color: white;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="app-info">
        <h1>${appName}</h1>
        <p>Created with HTML Previewer PWA</p>
    </div>
    ${code}
    
    <script>
        // Service Worker registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .catch(err => console.log('SW error:', err));
            });
        }
        
        // Install as PWA prompt
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            console.log('PWA can be installed');
        });
    <\/script>
</body>
</html>`;
        }
        
        function createManifest(appName, shortName, themeColor) {
            return JSON.stringify({
                "name": appName,
                "short_name": shortName,
                "description": "Created with HTML Previewer PWA",
                "start_url": "/",
                "display": "standalone",
                "background_color": "#ffffff",
                "theme_color": themeColor,
                "icons": [
                    {
                        "src": "icon-192.png",
                        "sizes": "192x192",
                        "type": "image/png"
                    }
                ]
            }, null, 2);
        }
        
        function createServiceWorker() {
            return `const CACHE_NAME = 'html-app-v1';
const urlsToCache = ['/', '/index.html', '/manifest.json', '/icon-192.png'];

self.addEventListener('install', event => {
  event.waitUntil(
    caches.open(CACHE_NAME)
      .then(cache => cache.addAll(urlsToCache))
  );
});

self.addEventListener('fetch', event => {
  event.respondWith(
    caches.match(event.request)
      .then(response => response || fetch(event.request))
  );
});`;
        }
        
        function createReadme(appName) {
            return `${appName} - PWA Application
=======================

Created with HTML Previewer PWA

How to install:
1. Unzip this folder
2. Upload to any web hosting (GitHub Pages, Netlify, Vercel)
3. Open the URL in Safari/Chrome
4. Click "Add to Home Screen"

Files included:
- index.html      (your HTML code)
- manifest.json   (PWA configuration)
- sw.js           (Service Worker for offline)
- icon-192.png    (app icon)

Note: Replace icon-192.png with your own 192x192 PNG icon.`;
        }
        
        function downloadAsZip(files, appName) {
            // Create a ZIP file using JSZip
            if (typeof JSZip === 'undefined') {
                // Load JSZip dynamically
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
                script.onload = () => createZip(files, appName);
                document.head.appendChild(script);
            } else {
                createZip(files, appName);
            }
        }
        
        function createZip(files, appName) {
            const zip = new JSZip();
            
            // Add all files to zip
            Object.entries(files).forEach(([filename, content]) => {
                zip.file(filename, content);
            });
            
            // Generate and download
            zip.generateAsync({type: 'blob'})
                .then(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${appName.replace(/\s+/g, '-').toLowerCase()}-pwa.zip`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                });
        }

        // =================== INIT ===================
        // Service Worker for this app
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .catch(err => console.log('SW error:', err));
            });
        }
    </script>
</body>
</html>
