<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Previewer PWA</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
            display: flex;
            flex-direction: column;
        }
        
        .container {
            max-width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            flex-grow: 1;
        }
        
        h1 {
            text-align: center;
            color: #5d3fd3;
            margin-bottom: 25px;
            font-size: 1.8em;
            font-weight: 700;
        }
        
        textarea {
            width: 100%;
            height: 200px;
            padding: 20px;
            border: 2px solid #e1e5e9;
            border-radius: 15px;
            font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace;
            font-size: 15px;
            line-height: 1.5;
            background: #f8f9fa;
            resize: none;
            transition: all 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }
        
        button {
            padding: 18px 15px;
            border: none;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        button:active {
            transform: scale(0.97);
        }
        
        .preview-btn {
            grid-column: span 2;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .clean-btn {
            background: #f8f9fa;
            color: #dc3545;
            border: 2px solid #f1f3f4;
        }
        
        .paste-btn {
            background: #f8f9fa;
            color: #28a745;
            border: 2px solid #f1f3f4;
        }
        
        .share-btn {
            grid-column: span 2;
            background: linear-gradient(135deg, #34d399 0%, #3b82f6 100%);
            color: white;
            margin-top: 10px;
            display: none;
        }
        
        .preview-frame {
            width: 100%;
            height: 300px;
            border: 2px solid #e1e5e9;
            border-radius: 15px;
            background: white;
            margin-top: 20px;
            display: none;
        }
        
        .status-bar {
            margin-top: 15px;
            padding: 10px;
            background: #e8f4fd;
            border-radius: 10px;
            font-size: 0.9em;
            color: #0d6efd;
            text-align: center;
        }
        
        /* Share Menu Styles */
        .share-menu {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }
        
        .share-menu-content {
            background: white;
            border-radius: 20px;
            padding: 0;
            width: 100%;
            max-width: 300px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .share-option {
            width: 100%;
            padding: 20px;
            border: none;
            background: white;
            font-size: 1.1em;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }
        
        .share-option:last-child {
            border-bottom: none;
            color: #666;
        }
        
        .share-option:hover, .share-option:active {
            background: #f8f9fa;
        }
        
        .share-option span {
            font-size: 1.3em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛠️ HTML Previewer PWA</h1>
        <textarea id="html-code" placeholder="<!DOCTYPE html>
<html>
<head>
    <title>My Page</title>
</head>
<body>
    <h1>Hello World!</h1>
    <p>This is a test page.</p>
</body>
</html>"></textarea>
        
        <div class="buttons">
            <button class="preview-btn" id="previewBtn">
                👁️ Open HTML Preview
            </button>
            <button class="clean-btn" id="cleanBtn">
                🗑️ Clean
            </button>
            <button class="paste-btn" id="pasteBtn">
                📋 Paste Code
            </button>
            <button class="share-btn" id="shareBtn">
                📲 Share HTML
            </button>
        </div>
        
        <iframe class="preview-frame" id="previewFrame" sandbox="allow-scripts"></iframe>
        
        <div class="status-bar" id="statusBar">
            Ready to work
        </div>
    </div>
    
    <!-- Share Menu -->
    <div class="share-menu" id="shareMenu">
        <div class="share-menu-content">
            <button class="share-option" id="addToHomeBtn">
                <span>🏠</span> Add to Home Screen
            </button>
            <button class="share-option" id="shareCodeBtn">
                <span>📤</span> Share Code
            </button>
            <button class="share-option" id="saveFileBtn">
                <span>💾</span> Save as HTML File
            </button>
            <button class="share-option" id="cancelShareBtn">
                <span>✕</span> Cancel
            </button>
        </div>
    </div>

    <script>
        // =================== ELEMENTS ===================
        const htmlCode = document.getElementById('html-code');
        const previewBtn = document.getElementById('previewBtn');
        const cleanBtn = document.getElementById('cleanBtn');
        const pasteBtn = document.getElementById('pasteBtn');
        const shareBtn = document.getElementById('shareBtn');
        const previewFrame = document.getElementById('previewFrame');
        const statusBar = document.getElementById('statusBar');
        
        // Share menu elements
        const shareMenu = document.getElementById('shareMenu');
        const addToHomeBtn = document.getElementById('addToHomeBtn');
        const shareCodeBtn = document.getElementById('shareCodeBtn');
        const saveFileBtn = document.getElementById('saveFileBtn');
        const cancelShareBtn = document.getElementById('cancelShareBtn');
        
        // =================== INITIAL CODE ===================
        htmlCode.value = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: #f0f0f0;
        }
        h1 {
            color: #3366cc;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin: 20px auto;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Your HTML works!</h1>
        <p>Change code and click "Open HTML Preview" again.</p>
        <p>Time: <span id="time">${new Date().toLocaleTimeString()}</span></p>
        <button onclick="document.getElementById('time').innerHTML = new Date().toLocaleTimeString()">
            Update Time
        </button>
    </div>
</body>
</html>`;

        // =================== SHARE BUTTON LOGIC ===================
        // Show/hide share button based on content
        htmlCode.addEventListener('input', function() {
            shareBtn.style.display = this.value.trim() ? 'block' : 'none';
        });
        
        // Check on load
        setTimeout(() => {
            shareBtn.style.display = htmlCode.value.trim() ? 'block' : 'none';
        }, 100);

        // Open share menu
        shareBtn.addEventListener('click', function() {
            if (!htmlCode.value.trim()) {
                statusBar.textContent = "Enter HTML code first!";
                statusBar.style.background = "#ffebee";
                statusBar.style.color = "#c62828";
                return;
            }
            shareMenu.style.display = 'flex';
        });

        // Close share menu
        cancelShareBtn.addEventListener('click', function() {
            shareMenu.style.display = 'none';
        });

        shareMenu.addEventListener('click', function(e) {
            if (e.target === shareMenu) {
                shareMenu.style.display = 'none';
            }
        });

        // =================== PREVIEW BUTTON ===================
        previewBtn.addEventListener('click', () => {
            if (!htmlCode.value.trim()) {
                statusBar.textContent = "Enter HTML code!";
                statusBar.style.background = "#ffebee";
                statusBar.style.color = "#c62828";
                return;
            }
            
            try {
                // Open in new window
                const newWindow = window.open('', '_blank');
                if (newWindow) {
                    newWindow.document.write(htmlCode.value);
                    newWindow.document.close();
                    statusBar.textContent = "Preview opened in new window";
                    statusBar.style.background = "#e8f5e9";
                    statusBar.style.color = "#2e7d32";
                } else {
                    throw new Error('Popup blocker');
                }
            } catch (e) {
                statusBar.textContent = "Allow popups in browser settings";
                statusBar.style.background = "#ffebee";
                statusBar.style.color = "#c62828";
            }
        });

        // =================== CLEAN BUTTON ===================
        cleanBtn.addEventListener('click', () => {
            htmlCode.value = "";
            previewFrame.style.display = "none";
            shareBtn.style.display = "none";
            statusBar.textContent = "Editor cleaned";
            statusBar.style.background = "#fff3e0";
            statusBar.style.color = "#ef6c00";
        });

        // =================== PASTE BUTTON ===================
        pasteBtn.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                htmlCode.value += text;
                statusBar.textContent = "Code pasted from clipboard";
                statusBar.style.background = "#e3f2fd";
                statusBar.style.color = "#1567c0";
                shareBtn.style.display = 'block';
            } catch (e) {
                statusBar.textContent = "Error: Paste manually (long press → Paste)";
                statusBar.style.background = "#ffebee";
                statusBar.style.color = "#c62828";
            }
        });

// =================== SHARE MENU OPTIONS ===================

// 1. ADD TO HOME SCREEN (без ZIP!)
addToHomeBtn.addEventListener('click', function() {
    shareMenu.style.display = 'none';
    
    // Создаём чистый HTML с PWA метатегами
    const pwaPage = `
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta name="apple-mobile-web-app-capable" content="yes">
            <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
            <title>My HTML App</title>
            <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📱</text></svg>">
            <style>
                body {
                    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
                    margin: 0;
                    padding: 20px;
                    background: white;
                }
            </style>
        </head>
        <body>
            ${htmlCode.value}
            
            <!-- Подсказка для iOS -->
            <div style="position: fixed; bottom: 0; left: 0; right: 0; background: #f0f0f0; padding: 15px; text-align: center; border-top: 1px solid #ddd; display: none;" id="iosHint">
                <p style="margin: 0; color: #333;">
                    <strong>To install:</strong> Tap <span style="color: #007aff;">Share</span> → 
                    <span style="color: #007aff;">Add to Home Screen</span>
                </p>
            </div>
            
            <script>
                // Показываем подсказку на iOS
                if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
                    setTimeout(() => {
                        document.getElementById('iosHint').style.display = 'block';
                    }, 1000);
                }
                
                // Автоскрытие подсказки
                setTimeout(() => {
                    document.getElementById('iosHint').style.display = 'none';
                }, 10000);
            <\/script>
        </body>
        </html>
    `;
    
    // Открываем в новой вкладке
    const newTab = window.open();
    newTab.document.write(pwaPage);
    newTab.document.close();
    
    statusBar.textContent = "Opened in new tab → Use Safari's Share → Add to Home Screen";
    statusBar.style.background = "#e8f5e9";
    statusBar.style.color = "#2e7d32";
});

// 2. SHARE CODE (просто копирует в буфер)
shareCodeBtn.addEventListener('click', async function() {
    shareMenu.style.display = 'none';
    
    try {
        await navigator.clipboard.writeText(htmlCode.value);
        statusBar.textContent = "HTML code copied to clipboard";
        statusBar.style.background = "#e8f5e9";
        statusBar.style.color = "#2e7d32";
    } catch (e) {
        // Фолбэк для старых браузеров
        const textArea = document.createElement('textarea');
        textArea.value = htmlCode.value;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        
        statusBar.textContent = "Code copied!";
        statusBar.style.background = "#e8f5e9";
        statusBar.style.color = "#2e7d32";
    }
});

// 3. SAVE AS HTML FILE (скачивает .html файл)
saveFileBtn.addEventListener('click', function() {
    shareMenu.style.display = 'none';
    
    const blob = new Blob([htmlCode.value], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'my-html-page.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    
    statusBar.textContent = "HTML file downloaded";
    statusBar.style.background = "#e3f2fd";
    statusBar.style.color = "#1567c0";
});

        // =================== PWA CREATION ===================
        function createPWAFromHTML() {
            const htmlContent = htmlCode.value;
            
            // Create a new HTML page with PWA capabilities
            const pwaHTML = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My HTML App</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="data:application/json;charset=utf-8,${encodeURIComponent(JSON.stringify({
        "name": "My HTML App",
        "short_name": "HTML App",
        "description": "Created with HTML Previewer",
        "start_url": ".",
        "display": "standalone",
        "background_color": "#667eea",
        "theme_color": "#764ba2"
    }))}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
</head>
<body>
    ${htmlContent}
    
    <script>
        // Auto-add to home screen on iOS
        if (window.navigator.standalone) {
            console.log('Running in PWA mode');
        }
        
        // Service Worker registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:text/javascript,self.addEventListener("install",e=>e.waitUntil(caches.open("v1").then(c=>c.addAll(["."]))));self.addEventListener("fetch",e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));')
                .catch(console.error);
        }
    <\/script>
</body>
</html>`;
            
            // Open the PWA in a new window
            const pwaWindow = window.open('', '_blank');
            if (pwaWindow) {
                pwaWindow.document.write(pwaHTML);
                pwaWindow.document.close();
                
                // Show iOS add to home screen instructions
                setTimeout(() => {
                    if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
                        pwaWindow.alert('To add to Home Screen:\n1. Tap Share button\n2. Scroll down\n3. Tap "Add to Home Screen"');
                    }
                }, 1000);
                
                statusBar.textContent = "PWA opened. Use Safari's Share → Add to Home Screen";
                statusBar.style.background = "#e8f5e9";
                statusBar.style.color = "#2e7d32";
            }
        }

        // =================== SERVICE WORKER ===================
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:text/javascript,' + encodeURIComponent(`
                self.addEventListener('install', event => {
                    event.waitUntil(
                        caches.open('html-previewer-v1').then(cache => {
                            return cache.addAll(['./']);
                        })
                    );
                });
                
                self.addEventListener('fetch', event => {
                    event.respondWith(
                        caches.match(event.request).then(response => {
                            return response || fetch(event.request);
                        })
                    );
                });
            `)).catch(console.error);
        }
    </script>
</body>
</html>
